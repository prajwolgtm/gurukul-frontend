<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123c35" />
    <title>Gurukul - Offline</title>
    <style>
      body { margin: 0; background: #f4f7f5; color: #182622; font: 16px system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      section { max-width: 420px; }
      img { width: 88px; height: 88px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { color: #5d6b67; line-height: 1.6; }
      button { border: 0; border-radius: 8px; padding: 12px 18px; background: #123c35; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main><section><img src="/logo192.png" alt="Gurukul" /><h1>You are offline</h1><p>Reconnect to the internet to load the latest Gurukul records.</p><button onclick="location.reload()">Try again</button></section></main>
  </body>
</html>
